name: Bug report
description: Something does not work as described
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: build
    attributes: { label: SE Inspect build (UI footer), placeholder: "1.0.0-alpha.2" }
    validations: { required: true }
  - type: dropdown
    id: wo
    attributes:
      label: Where
      options: ["Pi with hardware", "laptop / synthetic mode", "installer", "website configurator"]
    validations: { required: true }
  - type: textarea
    id: was
    attributes: { label: What happened, description: "Steps, what you expected, what you saw. Screenshots welcome." }
    validations: { required: true }
  - type: textarea
    id: log
    attributes: { label: Log, description: "install.log, or `journalctl -u vorsa -n 80`", render: text }
